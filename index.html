<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f7f5ef"><title>Pocket Party 6 — Arcade</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="arcade.css"></head><body>
<main id="home"><header><div class="brand"><b class="logo">p.</b><div>pocket party<small>PLAY TOGETHER. ANYWHERE.</small></div></div><button id="settings" class="round" aria-label="Settings">⚙</button></header>
<section class="party-banner"><div><div class="eyebrow">THE SAME-SCREEN ARCADE</div><h1>Pick a game.<br>Bring a rival.</h1><p>10 little games. Endless rematches.</p></div><div class="versus-art" aria-hidden="true"><span>1</span><i>VS</i><span>2</span></div></section>
<section class="setup"><div><h2>Who’s playing?</h2><p id="hint">You + a friendly bot</p></div><div id="players"><button data-n="1" class="selected">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button></div></section>
<button id="random" class="random"><span class="dice" aria-hidden="true"><svg width="27" height="27" viewBox="0 0 28 28"><rect x="2" y="2" width="24" height="24" rx="6" fill="none" stroke="#f4d564" stroke-width="2"/><g fill="#f4d564"><circle cx="8" cy="8" r="2"/><circle cx="20" cy="8" r="2"/><circle cx="14" cy="14" r="2"/><circle cx="8" cy="20" r="2"/><circle cx="20" cy="20" r="2"/></g></svg></span><span>Surprise us<small>Pick a random game</small></span><span class="arrow">↗</span></button>
<div class="section-title"><h2>Pick your playground</h2><small>10 GAMES</small></div><section id="grid" class="grid"></section><footer><span>● &nbsp;No Wi-Fi. No ads. Just play.</span><button id="wins">Party scores ↗</button></footer></main>
<main id="play" class="hidden"><header><button id="back" class="round" aria-label="Pause and exit">←</button><div class="game-heading"><h2 id="title"></h2><small id="tag"></small></div><button id="pause" class="round" aria-label="Pause">Ⅱ</button></header><div id="scores"></div><div id="top" class="pads"></div><div id="board-wrap"><canvas id="board" aria-label="Game board"></canvas></div><div id="bottom" class="pads"></div><div class="play-foot"><span id="message"></span><b id="clock"></b></div></main>
<div id="modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-card" id="modal-body"></div></div><script src="assets.js"></script><script src="studio-assets.js"></script><script src="game.js"></script><script src="deluxe.js"></script></body></html>
