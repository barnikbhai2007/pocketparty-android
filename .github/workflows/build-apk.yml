          saved = {}
          for target, info in manifest.items():
              source = root / info["source"]
              if not source.is_file():
                  raise SystemExit("Missing uploaded file: " + info["source"])
              data = source.read_bytes()
              if hashlib.sha256(data).hexdigest() != info["sha256"]:
                  raise SystemExit("Uploaded file changed since the verified repair: " + info["source"])
              saved[target] = data
          runtime = root / "app/src/main/assets"
          if runtime.exists():
              shutil.rmtree(runtime)
          for target, data in saved.items():
              dest = root / target
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
          (root / "gradlew").chmod(0o755)
          subprocess.run([sys.executable, "build-expansion.py"], check=True)
          expected = manifest["app/src/main/assets/game.js"]["sha256"]
          actual = hashlib.sha256((runtime / "game.js").read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit("The rebuilt runtime does not match the tested 20-game release")
          print("Restored 106 verified files. Ready to build Pocket Party 6 with 20 games.")
